name: POST-EV2-6 story retrieval

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  story-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run POST-EV2-6 proof
        run: pytest -q tests/post_ev2_6/test_story_retrieval.py
